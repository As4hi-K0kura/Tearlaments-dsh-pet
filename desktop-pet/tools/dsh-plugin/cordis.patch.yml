# ============================================================================
# dsh-pet-status 的 bundle patch —— 把插件挂进 DSH 配置树
# ============================================================================
#
# 【这是什么】
#   这是本包的「挂载声明」。DSH 启动时按 bundle 层栈把各插件的 patch 叠起来
#   组成配置树，本文件就是 dsh-pet-status 这一层的内容。
#
# 【工作原理】
#   - insert：往配置树里添加新的插件行（entry）
#   - entry 的 id 是行标识（patch 覆盖时按它定位），必须全局唯一且与包名一致
#   - 插件行那一行绝不能写行尾注释：商城预检用正则抓该行的值并要求其后直接
#     换行，行尾注释会让它抓不到 entry ID
#   - name: 'dsh-pet-status' 会解析到包入口 index.js（宿主半侧）
#
# ============================================================================

- insert:
    - id: dsh-pet-status
      name: 'dsh-pet-status'
