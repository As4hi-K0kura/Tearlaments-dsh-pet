  <!-- 眼睛 -->
  <circle cx="47" cy="27" r="2.6" fill="#20303f"/>
  <circle cx="48" cy="26" r="0.9" fill="#ffffff"/>

  <!-- 腮红 -->
  <circle cx="41.5" cy="31" r="2.1" fill="#ff9d9d" opacity="0.75"/>

  <!-- 状态气泡（右上角）：代表「工作状态档位」 -->
  <circle cx="51" cy="13" r="7" fill="#ffffff" opacity="0.92"/>
